name: horizon-daily

on:
  schedule:
    # GitHub 的 schedule 常延迟 2~5 小时甚至整体丢触发，所以多排几个候选点；
    # gate job 保证当天只真正生成一次。
    - cron: '45 9 * * *'    # 17:45 北京
    - cron: '45 11 * * *'   # 19:45 北京
    - cron: '45 13 * * *'   # 21:45 北京
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horizon-daily
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          # 定时触发的迟到场次：当天简报已存在就直接跳过，省一次 20 分钟的 Horizon 调用。
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "content/digest/$(date -u +%F).md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Clone Horizon (pinned)
        run: |
          git clone https://github.com/Thysrael/Horizon.git "$RUNNER_TEMP/horizon"
          git -C "$RUNNER_TEMP/horizon" checkout 0eda588fb0486a4b183bb3c613d6f20548514505
          cp -r tools/horizon/profiles/. "$RUNNER_TEMP/horizon/profiles/"

      - name: Run Horizon (24h)
        working-directory: ${{ runner.temp }}/horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "$GITHUB_WORKSPACE/tools/horizon/config.json" data/config.json
          uv run horizon --hours 24

      - name: Convert summary to Hugo content
        run: python tools/horizon/publish.py "${{ runner.temp }}/horizon/data/summaries" content/digest

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: Build site
        run: hugo --quiet

      - name: Commit briefing and rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/digest docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "digest: $(date -u +%F) 简报"
            git push
          fi

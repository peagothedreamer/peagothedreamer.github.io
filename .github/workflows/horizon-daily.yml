name: horizon-daily

on:
  schedule:
    # 主路径是外部 cron 服务打 workflow_dispatch；GitHub 自带 schedule 延迟 2~5 小时
    # 且会丢触发，只留两个晚间兜底，gate 保证当天不重复生成。
    - cron: '45 13 * * *'   # 21:45 北京
    - cron: '45 15 * * *'   # 23:45 北京
  workflow_dispatch:
    inputs:
      force:
        description: 当天简报已存在也重新生成
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: horizon-daily
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 排队期间别人可能已推送当天简报，必须看最新 main 而不是触发时的快照
      - id: check
        run: |
          # 当天简报已存在就跳过，省一次 20 分钟的 Horizon 调用；手动 force=true 可强制重跑。
          if [ "${{ inputs.force }}" != "true" ] && [ -f "content/horizon/$(date -u +%F).md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Clone Horizon (pinned)
        run: |
          git clone https://github.com/Thysrael/Horizon.git "$RUNNER_TEMP/horizon"
          git -C "$RUNNER_TEMP/horizon" checkout 0eda588fb0486a4b183bb3c613d6f20548514505
          cp -r tools/horizon/profiles/. "$RUNNER_TEMP/horizon/profiles/"

      - name: Run Horizon (24h)
        working-directory: ${{ runner.temp }}/horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "$GITHUB_WORKSPACE/tools/horizon/config.json" data/config.json
          uv run horizon --hours 24

      - name: Convert summary to Hugo content
        run: python tools/horizon/publish.py "${{ runner.temp }}/horizon/data/summaries" content/horizon

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: Build site
        run: hugo --quiet

      - name: Commit briefing and rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/horizon docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "horizon: $(date -u +%F) 简报"
            git pull --rebase origin main   # 跑的过程中有人 push 过，先变基再推
            git push
          fi

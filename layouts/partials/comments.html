{{- /* giscus 评论。配置在 config/_default/hugo.toml 的 [params.giscus]；
       整块删掉即可全站关闭评论。文章页和首页都用这一份。 */ -}}
{{ with site.Params.giscus }}
<section class="comments">
  <script src="https://giscus.app/client.js"
          data-repo="{{ .repo }}"
          data-repo-id="{{ .repoId }}"
          data-category="{{ .category }}"
          data-category-id="{{ .categoryId }}"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="top"
          data-theme="fro"
          data-lang="zh-CN"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
  <script>
    // giscus 在 client.js 执行时只读一次 data-theme。存了手动主题的人首屏会对不上，
    // 所以在它下载完成前按当前实际主题把属性改掉。
    (function () {
      var root = document.documentElement;
      var dark = root.dataset.theme
        ? root.dataset.theme === "dark"
        : matchMedia("(prefers-color-scheme: dark)").matches;
      document.querySelector('script[src="https://giscus.app/client.js"]').dataset.theme =
        dark ? "dark" : "fro";
    })();
  </script>
</section>
{{ end }}
